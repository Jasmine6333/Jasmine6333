<style>
  /* 版面概念：整個畫面是 3D 模型，左上角浮著一張像圖框標題欄的操作面板 */
  :root {
    --bg: #e9ebe7;
    --scene: #e3e6e1;
    --panel: rgba(255, 255, 255, 0.92);
    --fg: #1d2321;
    --muted: #5b6561;
    --line: #cdd3ce;
    --accent: #2c5f73;
    --accent-fg: #ffffff;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141817; --scene: #1a1f1e; --panel: rgba(29, 35, 34, 0.92);
      --fg: #e6ebe8; --muted: #9ba6a2; --line: #34403c;
      --accent: #8cc3d6; --accent-fg: #0e1a1f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141817; --scene: #1a1f1e; --panel: rgba(29, 35, 34, 0.92);
    --fg: #e6ebe8; --muted: #9ba6a2; --line: #34403c;
    --accent: #8cc3d6; --accent-fg: #0e1a1f; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }

  .stage {
    position: fixed;
    inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
    background: var(--scene);
  }
  .stage canvas { display: block; touch-action: none; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  .panel {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: calc(env(safe-area-inset-left, 0px) + 16px);
    width: min(350px, calc(100vw - 32px));
    max-height: calc(100% - 96px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
    display: grid;
    gap: 10px;
    backdrop-filter: blur(6px);
  }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  h1 { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
  .meta { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.5; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; }
  .group-label { width: 100%; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }
  button {
    font: inherit; font-size: 13px;
    padding: 6px 11px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

  details { border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 500; }
  .table-wrap { overflow-x: auto; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.num { text-align: right; }
  .note { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

  .hint {
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 10px;
  }
  .room-label {
    font-family: var(--font);
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 2px 7px;
    font-size: 12px;
    line-height: 1.35;
    text-align: center;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .room-label span { display: block; font-size: 10.5px; color: var(--muted); }

  @media (max-width: 560px) {
    .panel { padding: 10px 12px; gap: 8px; }
    h1 { font-size: 16px; }
    .hint { left: calc(env(safe-area-inset-left, 0px) + 16px); right: auto; }
    .room-label { font-size: 10.5px; padding: 1px 5px; }
  }
</style>

</section>

  { name: '洗手台',     x1: 6.54, y1: 7.95, x2: 7.07, y2: 8.67,  h: 0.85, color: '#f4f4f2' },
  { name: '淋浴底盤',   x1: 5.59, y1: 9.68, x2: 6.48, y2: 10.42, h: 0.05, color: '#e6e8e8' },
  { name: '淋浴拉門',   x1: 5.59, y1: 9.66, x2: 6.48, y2: 9.68,  h: 2.0,  color: '#bfe0ea', glass: true },
  // 書房兼客房
  { name: '臥榻',       x1: 7.25, y1: 9.00, x2: 9.10, y2: 10.37, h: 0.45, color: '#ecebe6' },
  { name: '書桌',       x1: 9.27, y1: 8.61, x2: 10.05, y2: 10.33, h: 0.75, color: '#9c7a58' },
  { name: '書桌椅',     x1: 10.23, y1: 9.15, x2: 10.64, y2: 9.62, h: 0.45, color: '#3f3f3f' },
  { name: '休閒椅',     x1: 10.23, y1: 7.07, x2: 11.18, y2: 7.96, h: 0.45, color: '#9a8f84' },
  // 女兒房
  { name: '單人床',     x1: 9.57, y1: 4.75, x2: 10.46, y2: 6.77, h: 0.5,  color: '#ecebe6' },
  { name: '衣櫃',       x1: 7.19, y1: 4.69, x2: 8.08,  y2: 5.28, h: 2.2,  color: '#d8cfc2' },
  { name: '書桌',       x1: 8.08, y1: 4.69, x2: 9.51,  y2: 5.28, h: 0.75, color: '#9c7a58' },
  { name: '書桌椅',     x1: 8.56, y1: 5.40, x2: 9.04,  y2: 5.88, h: 0.45, color: '#3f3f3f' },
  // 儲藏室
  { name: '收納架',     x1: 5.95, y1: 4.69, x2: 7.07, y2: 5.20, h: 2.2, color: '#c9c1b4' },
  // 西側陽台
  { name: '洗衣機',     x1: -0.60, y1: 2.61, x2: -0.10, y2: 3.12, h: 0.85, color: '#f0f0f0' },
  { name: '熱水器',     x1: -0.68, y1: 0.83, x2: -0.24, y2: 1.31, h: 1.2,  color: '#e2e2e2' },
];

/* =========================================================
   2. 座標換算：平面 (x, y) → 3D 場景 (X, Z)，北方朝畫面上方
   ========================================================= */
const toX = x => x - PLAN.W / 2;
const toZ = y => -(y - PLAN.D / 2);

/* ---------- 面板文字與座標表 ---------- */
const rectArea = ([x1, y1, x2, y2]) => (x2 - x1) * (y2 - y1);
const roomArea = r => r.rects.reduce((s, q) => s + rectArea(q), 0);
const total = ROOMS.reduce((s, r) => s + roomArea(r), 0);
document.getElementById('meta').textContent =
  `3 房 2 廳 2 衛 · 外框 ${PLAN.W} × ${PLAN.D} m · 室內約 ${total.toFixed(0)} m²（約 ${(total / 3.3058).toFixed(1)} 坪，不含陽台）· 淨高 ${PLAN.H} m`;
const fmt = n => n.toFixed(2).replace(/\.?0+$/, '');
document.getElementById('room-table').innerHTML = ROOMS.map(r => r.rects.map((q, i) =>
  `<tr><td>${i === 0 ? r.name : ''}</td><td>${fmt(q[0])}–${fmt(q[2])}</td><td>${fmt(q[1])}–${fmt(q[3])}</td><td class="num">${i === 0 ? roomArea(r).toFixed(1) + ' m²' : ''}</td></tr>`
).join('')).join('');

/* =========================================================
   3. 場景、相機、燈光
   ========================================================= */
const stage = document.getElementById('stage');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = 'labels';
stage.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 3;
controls.maxDistance = 40;
controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b2a6, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e2, 1.8);
sun.position.set(5, 13, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 50 });
sun.shadow.bias = -0.0005;
scene.add(sun);

function applyTheme() {
  const c = getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() || '#e3e6e1';
  scene.background = new THREE.Color(c);
}
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* =========================================================
   4. 建立模型
   ========================================================= */
const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...opts });

function box(w, h, d, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
// 以平面範圍放置方塊
function placeBox(x1, y1, x2, y2, z0, h, material) {
  const m = box(x2 - x1, h, y2 - y1, material);
  m.position.set(toX((x1 + x2) / 2), z0 + h / 2, toZ((y1 + y2) / 2));
  return m;
}

// 樓板
const slab = placeBox(0, 0, PLAN.W, PLAN.D, -0.2, 0.2, mat('#8a8580'));
slab.castShadow = false;
scene.add(slab);

// 地板與空間名稱
const labels = [];
function addLabel(text, sub, x, y) {
  const div = document.createElement('div');
  div.className = 'room-label';
  div.innerHTML = sub ? `${text}<span>${sub}</span>` : text;
  const label = new CSS2DObject(div);
  label.position.set(toX(x), 0.15, toZ(y));
  scene.add(label);
  labels.push(label);
}
for (const r of ROOMS) {
  for (const [x1, y1, x2, y2] of r.rects) {
    const f = placeBox(x1, y1, x2, y2, 0, 0.02, mat(r.floor));
    f.castShadow = false;
    scene.add(f);
  }
  const [x1, y1, x2, y2] = r.rects[0];
  const [lx, ly] = r.label || [(x1 + x2) / 2, (y1 + y2) / 2];
  addLabel(r.name, `${roomArea(r).toFixed(1)} m²`, lx, ly);
}

// 陽台：地坪 + 女兒牆（12 cm，高 1.1 m）
const parapetMat = mat('#e9e4dc');
for (const b of BALCONIES) {
  const fl = placeBox(b.x1, b.y1, b.x2, b.y2, -0.2, 0.2, mat('#9aa0a0'));
  fl.castShadow = false;
  scene.add(fl);
  const t = 0.12, ph = 1.1;
  const outerX = b.side === 'east' ? [b.x1, b.x1 + t] : [b.x2 - t, b.x2];
  scene.add(placeBox(outerX[0], b.y1, outerX[1], b.y2, 0, ph, parapetMat));
  scene.add(placeBox(b.x1, b.y1, b.x2, b.y1 + t, 0, ph, parapetMat));
  scene.add(placeBox(b.x1, b.y2 - t, b.x2, b.y2, 0, ph, parapetMat));
  addLabel('陽台', '', (b.x1 + b.x2) / 2, (b.y1 + b.y2) / 2);
}

// 牆體、柱、管道間（會隨剖切高度重建）
const wallSide = mat('#f1ece4');
const wallTop = mat('#5e5650');                 // 牆頂剖面用深色，看得出牆厚
const wallMats = [wallSide, wallSide, wallTop, wallSide, wallSide, wallSide];
const colSide = mat('#e4ddd2');
const colMats = [colSide, colSide, wallTop, colSide, colSide, colSide];
const shaftSide = mat('#cfc6b9');
const shaftMats = [shaftSide, shaftSide, wallTop, shaftSide, shaftSide, shaftSide];
const glassMat = mat('#bfe0ea', { transparent: true, opacity: 0.35, roughness: 0.1 });
let structGroup = null;

function buildStructure(cutH) {
  if (structGroup) {
    structGroup.traverse(o => o.geometry && o.geometry.dispose());
    scene.remove(structGroup);
  }
  structGroup = new THREE.Group();
  const top = Math.min(PLAN.H, cutH);

  for (const [x, y] of COLUMNS) structGroup.add(placeBox(x, y, x + 0.8, y + 0.8, 0, top, colMats));
  for (const s of SHAFTS) structGroup.add(placeBox(s.x1, s.y1, s.x2, s.y2, 0, top, shaftMats));

  for (const w of WALLS) {
    const T = w.t;
    const horizontal = w.a[1] === w.b[1];
    const fixed = horizontal ? w.a[1] : w.a[0];
    const s0 = horizontal ? Math.min(w.a[0], w.b[0]) : Math.min(w.a[1], w.b[1]);
    const s1 = horizontal ? Math.max(w.a[0], w.b[0]) : Math.max(w.a[1], w.b[1]);

    const pieces = [];
    let cur = s0;
    for (const o of [...w.openings].sort((p, q) => p.from - q.from)) {
      pieces.push({ a: cur, b: o.from, z0: 0, z1: PLAN.H });
      if (o.sill > 0) pieces.push({ a: o.from, b: o.to, z0: 0, z1: o.sill });
      pieces.push({ a: o.from, b: o.to, z0: o.sill + o.h, z1: PLAN.H });
      if (o.type === 'window') pieces.push({ a: o.from, b: o.to, z0: o.sill, z1: o.sill + o.h, glass: true });
      cur = o.to;
    }
    pieces.push({ a: cur, b: s1, z0: 0, z1: PLAN.H });

    for (const p of pieces) {
      const z1 = Math.min(p.z1, cutH);
      const len = p.b - p.a;
      const ht = z1 - p.z0;
      if (len <= 0.001 || ht <= 0.001) continue;
      const thick = p.glass ? 0.02 : T;
      const m = box(horizontal ? len : thick, ht, horizontal ? thick : len, p.glass ? glassMat : wallMats);
      if (p.glass) m.castShadow = false;
      const mid = (p.a + p.b) / 2;
      m.position.set(
        horizontal ? toX(mid) : toX(fixed),
        p.z0 + ht / 2,
        horizontal ? toZ(fixed) : toZ(mid)
      );
      structGroup.add(m);
    }
  }
  scene.add(structGroup);
}
buildStructure(1.2);

// 家具
const furnGroup = new THREE.Group();
for (const f of FURNITURE) {
  const m = placeBox(f.x1, f.y1, f.x2, f.y2, f.z0 || 0, f.h,
    f.glass ? glassMat : mat(f.color, { roughness: 0.75 }));
  if (f.glass) m.castShadow = false;
  furnGroup.add(m);
}
scene.add(furnGroup);

/* =========================================================
   5. 視角切換與按鈕
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tween = null;

function viewScale() { return camera.aspect < 1 ? 1.75 : 1; }
// 寬螢幕時把模型往右移一點，避免被左上角面板擋住
function viewTarget() { return new THREE.Vector3(camera.aspect > 1.2 ? -2.4 : 0, 0, 0); }
const VIEWS = {
  persp: () => { const t = viewTarget(); return { pos: new THREE.Vector3(7.5, 18.5, 12.5).multiplyScalar(viewScale()).add(t), target: t }; },
  top:   () => { const t = viewTarget(); return { pos: new THREE.Vector3(0, 20 * viewScale(), 0.001).add(t), target: t }; },
};

function flyTo(name) {
  const { pos, target } = VIEWS[name]();
  if (reduceMotion) {
    camera.position.copy(pos);
    controls.target.copy(target);
    return;
  }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, start: performance.now(), dur: 800 };
}

function toggle(btn, fn) {
  btn.addEventListener('click', () => {
    const on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', String(on));
    fn(on);
  });
}

document.getElementById('btn-persp').addEventListener('click', () => flyTo('persp'));
document.getElementById('btn-top').addEventListener('click', () => flyTo('top'));
document.getElementById('btn-reset').addEventListener('click', () => flyTo('persp'));
toggle(document.getElementById('btn-cut'),   on => buildStructure(on ? 1.2 : PLAN.H));
toggle(document.getElementById('btn-furn'),  on => { furnGroup.visible = on; });
toggle(document.getElementById('btn-label'), on => { labels.forEach(l => { l.visible = on; }); });
toggle(document.getElementById('btn-spin'),  on => { controls.autoRotate = on; });

/* =========================================================
   6. 尺寸調整與繪製迴圈
   ========================================================= */
function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

const start = VIEWS.persp();
camera.position.copy(start.pos);
controls.target.copy(start.target);

renderer.setAnimationLoop(now => {
  if (tween) {
    const k = Math.min(1, (now - tween.start) / tween.dur);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k === 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
